name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff
        run: uv run ruff check packages/

      - name: Pytest
        run: uv run pytest -v

      - name: CLI smoke
        run: |
          uv run iridium-client demo
          uv run iridium-client payload dump packages/iridium-client/src/iridium_client/demo --validate

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheels
        run: |
          uv sync --all-packages
          uv build --package iridium-core
          uv build --package iridium-client
          uv build --package iridium-mcp-server
