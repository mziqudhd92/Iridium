name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync docs version from VERSION
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          python3 - "$V" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          index = pathlib.Path("docs/index.html")
          index.write_text(
              re.sub(
                  r'(<strong class="accent">)[^<]*(</strong>)',
                  rf"\g<1>{version}\g<2>",
                  index.read_text(encoding="utf-8"),
                  count=1,
              ),
              encoding="utf-8",
          )
          cast = pathlib.Path("docs/assets/iridium-client-demo.cast")
          if cast.exists():
              cast.write_text(
                  re.sub(r"Version: [0-9][0-9A-Za-z.+-]*", f"Version: {version}", cast.read_text(encoding="utf-8")),
                  encoding="utf-8",
              )
          print(f"docs release version -> {version}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
