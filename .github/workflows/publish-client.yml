# Publishes iridium-client to PyPI (trusted publisher: iridium-client / publish-client.yml)
name: Publish iridium-client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build iridium-client
        run: |
          uv sync --all-packages
          uv build --package iridium-client

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
