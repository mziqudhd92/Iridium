# Publishes iridium-core to PyPI (trusted publisher: iridium-core / release.yml)
name: Release iridium-core

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build iridium-core
        run: |
          uv sync --all-packages
          uv build --package iridium-core

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
