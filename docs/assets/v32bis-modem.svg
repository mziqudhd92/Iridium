<svg xmlns="http://www.w3.org/2000/svg" width="220" height="150" viewBox="0 0 220 150" role="img" aria-label="SupraFAXModem 144 LC style V.32bis modem">
  <defs>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8dcc4"/>
      <stop offset="55%" stop-color="#cfc0a2"/>
      <stop offset="100%" stop-color="#b9a986"/>
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b9a986"/>
      <stop offset="100%" stop-color="#9f9074"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd1b8"/>
      <stop offset="100%" stop-color="#c4b595"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="108" cy="138" rx="72" ry="7" fill="#000" opacity="0.12"/>

  <!-- top surface + vents (Supra compact wedge) -->
  <path d="M34 42 L186 34 L192 52 L40 60 Z" fill="url(#top)" stroke="#9a8c72" stroke-width="1"/>
  <g stroke="#8f8168" stroke-width="1.2">
    <line x1="118" y1="37" x2="118" y2="52"/>
    <line x1="126" y1="36.2" x2="126" y2="51.2"/>
    <line x1="134" y1="35.4" x2="134" y2="50.4"/>
    <line x1="142" y1="34.6" x2="142" y2="49.6"/>
    <line x1="150" y1="33.8" x2="150" y2="48.8"/>
    <line x1="158" y1="33" x2="158" y2="48"/>
    <line x1="166" y1="32.2" x2="166" y2="47.2"/>
    <line x1="174" y1="31.4" x2="174" y2="46.4"/>
  </g>

  <!-- right side -->
  <path d="M186 34 L192 52 L192 112 L186 128 L186 34 Z" fill="url(#side)" stroke="#8f8168" stroke-width="1"/>

  <!-- main case -->
  <path d="M34 42 L186 34 L186 128 L34 120 Z" fill="url(#case)" stroke="#9a8c72" stroke-width="1.4"/>

  <!-- front inset panel -->
  <path d="M48 54 L170 50 L172 104 L50 108 Z" fill="#101010" stroke="#2a2a2a" stroke-width="1"/>

  <!-- SUPRA logo -->
  <text x="58" y="72" fill="#d62828" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">SUPRA</text>
  <text x="58" y="84" fill="#bdbdbd" font-family="Helvetica, Arial, sans-serif" font-size="6.5" letter-spacing="0.8">FAX MODEM</text>

  <!-- speed readout -->
  <text x="132" y="71" fill="#f4f4f4" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">14.4</text>
  <text x="132" y="84" fill="#9e9e9e" font-family="Helvetica, Arial, sans-serif" font-size="7.5" letter-spacing="0.4">V.32bis</text>

  <!-- LED row (144 LC style) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="4.2" fill="#7a7a7a">
    <text x="56" y="99">AA</text>
    <text x="70" y="99">CD</text>
    <text x="84" y="99">RD</text>
    <text x="98" y="99">SD</text>
    <text x="112" y="99">TR</text>
    <text x="126" y="99">MR</text>
    <text x="140" y="99">RS</text>
    <text x="154" y="99">CS</text>
  </g>
  <rect x="55" y="101" width="5" height="3" rx="0.5" fill="#2e7d32"/>
  <rect x="69" y="101" width="5" height="3" rx="0.5" fill="#2e7d32"/>
  <rect x="83" y="101" width="5" height="3" rx="0.5" fill="#2e7d32"/>
  <rect x="97" y="101" width="5" height="3" rx="0.5" fill="#2e7d32"/>
  <rect x="111" y="101" width="5" height="3" rx="0.5" fill="#f9a825"/>
  <rect x="125" y="101" width="5" height="3" rx="0.5" fill="#c62828"/>
  <rect x="139" y="101" width="5" height="3" rx="0.5" fill="#c62828"/>
  <rect x="153" y="101" width="5" height="3" rx="0.5" fill="#2e7d32"/>

  <!-- feet -->
  <rect x="52" y="118" width="10" height="4" rx="1.5" fill="#3a3a3a"/>
  <rect x="158" y="122" width="10" height="4" rx="1.5" fill="#3a3a3a"/>
</svg>
