<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Strict CGA Mode 4 (Black, White, Cyan, Magenta) -->
  <rect width="16" height="16" fill="#000000"/>
  <!-- Digger body (CGA Cyan) -->
  <rect x="2" y="2" width="10" height="10" fill="#55ffff"/>
  <rect x="4" y="1" width="6" height="1" fill="#55ffff"/>
  <!-- Eye -->
  <rect x="7" y="3" width="3" height="3" fill="#ffffff"/>
  <rect x="8" y="4" width="2" height="2" fill="#000000"/>
  <!-- Open mouth (Magenta interior) -->
  <rect x="8" y="7" width="5" height="4" fill="#000000"/>
  <rect x="8" y="8" width="3" height="2" fill="#ff55ff"/>
  <!-- Shovel teeth (White) -->
  <rect x="13" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="13" y="10" width="2" height="2" fill="#ffffff"/>
  <!-- Treads (White) -->
  <rect x="2" y="12" width="12" height="3" fill="#ffffff"/>
  <rect x="3" y="13" width="2" height="1" fill="#000000"/>
  <rect x="7" y="13" width="2" height="1" fill="#000000"/>
  <rect x="11" y="13" width="2" height="1" fill="#000000"/>
</svg>
