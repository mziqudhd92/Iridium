[project]
name = "iridium-mcp-server"
version = "0.1.0"
description = "Iridium MCP server for AI agent security guardrails (Phase 1 skeleton)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Iridium Contributors" }]
dependencies = [
    "iridium-core==0.1.0",
]

[project.scripts]
iridium-mcp-server = "iridium_mcp.server:main"

[project.urls]
Homepage = "https://github.com/mziqudhd92/Iridium"
Repository = "https://github.com/mziqudhd92/Iridium"
Documentation = "https://github.com/mziqudhd92/Iridium#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iridium_mcp"]

[tool.uv.sources]
iridium-core = { workspace = true }
