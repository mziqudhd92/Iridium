[project]
name = "iridium-monorepo"
dynamic = ["version"]
description = "Iridium public OSS monorepo (iridium-core, iridium-client, iridium-mcp-server)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "iridium-client",
    "iridium-core",
    "iridium-mcp-server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
iridium-client = { workspace = true }
iridium-core = { workspace = true }
iridium-mcp-server = { workspace = true }

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/iridium-core/tests",
    "packages/iridium-client/tests",
    "packages/iridium-mcp-server/tests",
]
pythonpath = [
    "packages/iridium-core/src",
    "packages/iridium-client/src",
    "packages/iridium-mcp-server/src",
]

[tool.coverage.run]
source = ["iridium_core", "iridium_client", "iridium_mcp"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100  # project standard (100 columns)
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"packages/iridium-client/src/iridium_client/cli.py" = ["B008"]
"packages/iridium-client/src/iridium_client/api/client.py" = ["BLE001"]
"packages/iridium-mcp-server/src/iridium_mcp/api_client.py" = ["BLE001"]
"packages/iridium-mcp-server/src/iridium_mcp/indexer.py" = ["BLE001"]
